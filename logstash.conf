input {
  beats {
    port => 5044
  }
}

filter {
  # ---------------- Nginx access log ----------------
  if [fields][log_source] == "nginx_access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      tag_on_failure => ["_grok_nginx_access_failure"]
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
    mutate {
      convert => { "response" => "integer" "bytes" => "integer" }
    }
  }

  # ---------------- Nginx error log ----------------
  else if [fields][log_source] == "nginx_error" {
    grok {
      match => { "message" => "(?<err_ts>%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}) \[%{LOGLEVEL:log_level}\] %{POSINT:pid}#%{NUMBER:tid}: (\*%{NUMBER:connection_id} )?%{GREEDYDATA:error_message}" }
      tag_on_failure => ["_grok_nginx_error_failure"]
    }
    date {
      match => ["err_ts", "yyyy/MM/dd HH:mm:ss"]
      timezone => "UTC"
      target => "@timestamp"
      remove_field => ["err_ts"]
    }
  }

  # ---------------- Application log (JSON lines) ----------------
  else if [fields][log_source] == "application" {
    json {
      source => "message"
      skip_on_invalid_json => true
      tag_on_failure => ["_json_app_failure"]
    }
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
    mutate {
      convert => { "duration_ms" => "integer" "status" => "integer" }
    }
  }

  # ---------------- System log (syslog) ----------------
  else if [fields][log_source] == "system" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_ts} %{SYSLOGHOST:hostname} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:syslog_message}" }
      tag_on_failure => ["_grok_system_failure"]
    }
    date {
      match => ["syslog_ts", "MMM  d HH:mm:ss", "MMM d HH:mm:ss"]
      timezone => "UTC"
      target => "@timestamp"
      remove_field => ["syslog_ts"]
    }
  }

  # Drop noisy beat metadata
  mutate {
    remove_field => ["[agent]", "[ecs]", "[input]"]
  }
}

output {
  if [fields][log_source] == "nginx_access" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "elk-nginx-access-%{+YYYY.MM.dd}"
    }
  } else if [fields][log_source] == "nginx_error" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "elk-nginx-error-%{+YYYY.MM.dd}"
    }
  } else if [fields][log_source] == "application" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "elk-application-%{+YYYY.MM.dd}"
    }
  } else if [fields][log_source] == "system" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "elk-system-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "elk-unknown-%{+YYYY.MM.dd}"
    }
  }
}
